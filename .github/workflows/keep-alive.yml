# Keeps the PowerPulse backend on Render's free tier awake.
# Render puts a free service to sleep after 15 minutes without traffic,
# so this pings the health endpoint every 10 minutes.
name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping PowerPulse health endpoint
        run: |
          URL="https://powerpulse-739g.onrender.com/actuator/health"
          # A sleeping Spring Boot instance can take 1-2 minutes to start,
          # so allow a long timeout and retry a few times.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL" || echo 000)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Backend did not answer with 200"
          exit 1
